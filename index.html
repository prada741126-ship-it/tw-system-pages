<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#1a1a2e">
<meta name="description" content="台灣版整合管理系統">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<title>台灣版整合系統</title>
<link rel="stylesheet" href="app.css?v=1788184163442">
</head>
<body>

<!-- 登入畫面（帳號制：與 APP 共用帳號） -->
<div id="login-overlay">
  <div class="login-box">
    <img class="brand-full" src="icons/brand-360.png" alt="博盈" draggable="false">
    <div class="login-sub">台灣版整合管理 · 授權登入</div>
    <input type="email" id="login-email" placeholder="帳號（Email）" autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('login-pwd').focus()">
    <input type="password" id="login-pwd" placeholder="密碼" autocomplete="current-password" onkeydown="if(event.key==='Enter')handleLogin()">
    <button id="login-btn" onclick="handleLogin()">進 入 系 統</button>
  </div>
</div>

<!-- 首次設定精靈（偵測 users 為空時顯示：建立超級管理員） -->
<div id="setup-overlay" style="display:none;">
  <div class="login-box">
    <img class="brand-full" src="icons/brand-360.png" alt="博盈" draggable="false">
    <div class="login-sub">台灣版整合管理 · 首次建立管理員帳號</div>
    <input type="text" id="setup-name" placeholder="姓名（顯示名稱）" onkeydown="if(event.key==='Enter')document.getElementById('setup-email').focus()">
    <input type="email" id="setup-email" placeholder="帳號（Email）" autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('setup-pwd').focus()">
    <input type="password" id="setup-pwd" placeholder="密碼（至少 6 位）" autocomplete="new-password" onkeydown="if(event.key==='Enter')document.getElementById('setup-pwd2').focus()">
    <input type="password" id="setup-pwd2" placeholder="再次輸入密碼" autocomplete="new-password" onkeydown="if(event.key==='Enter')handleSetup()">
    <button id="setup-btn" onclick="handleSetup()">建 立 管 理 員 帳 號</button>
  </div>
</div>

<!-- 主應用 -->
<div id="app" style="display:none;">
  <!-- 側邊欄 -->
  <div class="sidebar">
    <div class="sidebar-brand">
      <img class="brand-full" src="icons/brand-240.png" alt="博盈" draggable="false">
    </div>
    <ul class="nav-list" id="nav-list"></ul>
  </div>

  <!-- 主內容區 -->
  <div class="main-content">
    <div class="topbar">
      <h2 id="topbar-title">總覽</h2>
      <div class="topbar-right">
        <div id="sync-status"></div>
        <div id="user-chip" class="user-chip"></div>
        <button class="logout-btn" onclick="SettingsPage.changePwdModal()">改密碼</button>
        <button class="logout-btn" onclick="handleLogout()">登出</button>
      </div>
    </div>
    <div id="page-overview" class="page-section active"></div>
    <div id="page-pending" class="page-section"></div>
    <div id="page-member" class="page-section"></div>
    <div id="page-room" class="page-section"></div>
    <div id="page-fees" class="page-section"></div>
    <div id="page-profit" class="page-section"></div>
    <div id="page-agent" class="page-section"></div>
    <div id="page-shareholder" class="page-section"></div>
    <div id="page-members-mgmt" class="page-section"></div>
    <div id="page-history" class="page-section"></div>
    <div id="page-reports" class="page-section"></div>
    <div id="page-wallet" class="page-section"></div>
    <div id="page-audit-log" class="page-section"></div>
    <div id="page-settings" class="page-section"></div>
  </div>
</div>

<!-- Modal -->
<div id="modal-overlay">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="modal-title"></h3>
      <button class="modal-close" onclick="Modal.close()">×</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<!-- Toast -->
<div id="toast-container" class="toast-container"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" defer></script>
<script src="app.js?v=1788184163442"></script>
</body>
</html>
